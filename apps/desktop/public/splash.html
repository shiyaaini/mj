<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>米家</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b1016;
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }
      .splash {
        position: relative;
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        background:
          radial-gradient(ellipse 70% 55% at 50% 42%, rgba(255, 122, 24, 0.16), transparent 62%),
          radial-gradient(ellipse 50% 40% at 50% 70%, rgba(25, 204, 148, 0.08), transparent 70%),
          linear-gradient(165deg, #121821 0%, #0b1016 55%, #090d12 100%);
      }
      .splash::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
        background-size: 48px 48px;
        mask-image: radial-gradient(circle at center, black 20%, transparent 75%);
        pointer-events: none;
        opacity: 0.7;
      }
      .stage {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        animation: stage-in 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .logo-wrap {
        position: relative;
        width: 88px;
        height: 88px;
        display: grid;
        place-items: center;
      }
      .logo-glow {
        position: absolute;
        inset: -18px;
        border-radius: 28px;
        background: radial-gradient(circle, rgba(255, 122, 24, 0.45), transparent 68%);
        filter: blur(10px);
        animation: glow-pulse 1.6s ease-in-out infinite;
      }
      .logo {
        position: relative;
        width: 72px;
        height: 72px;
        border-radius: 18px;
        object-fit: cover;
        box-shadow:
          0 12px 32px rgba(0, 0, 0, 0.45),
          0 0 0 1px rgba(255, 255, 255, 0.08);
        animation: logo-pop 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.08s both;
      }
      .brand {
        color: #f4f7fb;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-indent: 0.18em;
        text-shadow: 0 2px 16px rgba(0, 0, 0, 0.45);
        animation: text-in 0.55s ease 0.22s both;
      }
      .hint {
        color: rgba(220, 228, 238, 0.55);
        font-size: 12px;
        letter-spacing: 0.08em;
        animation: text-in 0.55s ease 0.35s both;
      }
      .bar {
        width: 148px;
        height: 3px;
        margin-top: 6px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
        animation: text-in 0.55s ease 0.4s both;
      }
      .bar > i {
        display: block;
        height: 100%;
        width: 40%;
        border-radius: inherit;
        background: linear-gradient(90deg, #ff8a3d, #19cc94);
        animation: bar-slide 1.15s ease-in-out infinite;
      }
      @keyframes stage-in {
        from {
          opacity: 0;
          transform: translateY(12px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes logo-pop {
        from {
          opacity: 0;
          transform: scale(0.72);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes glow-pulse {
        0%,
        100% {
          opacity: 0.55;
          transform: scale(0.92);
        }
        50% {
          opacity: 1;
          transform: scale(1.05);
        }
      }
      @keyframes text-in {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes bar-slide {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(320%);
        }
      }
    </style>
  </head>
  <body>
    <div class="splash">
      <div class="stage">
        <div class="logo-wrap">
          <div class="logo-glow" aria-hidden="true"></div>
          <img class="logo" src="./logo.png" alt="米家" width="72" height="72" />
        </div>
        <div class="brand">米家</div>
        <div class="hint">正在启动…</div>
        <div class="bar" aria-hidden="true"><i></i></div>
      </div>
    </div>
  </body>
</html>
