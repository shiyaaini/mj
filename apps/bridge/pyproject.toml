[project]
name = "mi-home-bridge"
version = "0.2.0"
description = "Local Python bridge for mijiaAPI"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.116.0",
  "mijiaapi>=4.2.1",
  "pydantic-settings>=2.15.0",
  "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
build = [
  "pyinstaller>=6.14.0",
]

[tool.uv]
package = false
default-groups = []
